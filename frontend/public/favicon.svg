<svg xmlns="http://www.w3.org/2000/svg" viewBox="168 82 490 490" width="490" height="490" role="img" aria-label="学习搭子">
  <title>几何抽象鸡头 · 学习搭子</title>
  <defs>
    <radialGradient id="headFill" cx="0.56" cy="0.46" r="0.62">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F1E7D6"/>
    </radialGradient>
    <linearGradient id="combFill" x1="0" y1="1" x2="0.35" y2="0">
      <stop offset="0" stop-color="#8C1A12"/>
      <stop offset="1" stop-color="#D63E28"/>
    </linearGradient>
    <linearGradient id="beakFill" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#E9BC63"/>
      <stop offset="1" stop-color="#C4851B"/>
    </linearGradient>
    <linearGradient id="wattleFill" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#C4281C"/>
      <stop offset="1" stop-color="#7E140E"/>
    </linearGradient>
  </defs>

  <!-- 底：奶油纸面 -->
  <rect x="168" y="82" width="490" height="490" fill="#FAF6EF"/>

  <!-- 头颈主轮廓 -->
  <path d="M600 306 L452 278 L400 262 L335 256 L266 246 L232 296 L226 356 L254 418 L272 486 L284 540 L510 540 L496 470 L476 430 L462 374 L450 346 L452 312 Z"
        fill="url(#headFill)" stroke="#1B1A17" stroke-width="9" stroke-linejoin="round"/>

  <!-- 内部三角切面（低透明度色块，小尺寸下融为柔和层次） -->
  <polygon points="394,322 335,256 266,246" fill="#D9A441" opacity="0.16"/>
  <polygon points="394,322 266,246 254,418" fill="#B3271E" opacity="0.07"/>
  <polygon points="394,322 254,418 272,486 284,540" fill="#1F5E56" opacity="0.07"/>
  <polygon points="394,322 284,540 510,540 496,470" fill="#D9A441" opacity="0.09"/>
  <polygon points="394,322 452,278 450,346" fill="#B3271E" opacity="0.13"/>

  <!-- 切面骨架：只留 4 条主线，保证 64px 以上有结构感、32px 以下不产生噪点 -->
  <g stroke="#1B1A17" stroke-width="4" opacity="0.32" stroke-linecap="round">
    <line x1="394" y1="322" x2="266" y2="246"/>
    <line x1="394" y1="322" x2="452" y2="278"/>
    <line x1="394" y1="322" x2="254" y2="418"/>
    <line x1="394" y1="322" x2="510" y2="540"/>
  </g>

  <!-- 鸡冠：锯齿三角 -->
  <path d="M258 238 L274 138 L300 244 L336 104 L362 250 L400 116 L424 262 L452 190 L458 278 L400 258 L335 250 L266 240 Z"
        fill="url(#combFill)" stroke="#1B1A17" stroke-width="7" stroke-linejoin="round"/>

  <!-- 喙：锐角楔形 -->
  <polygon points="452,278 600,306 452,312" fill="url(#beakFill)" stroke="#1B1A17" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="492" cy="297" r="4.5" fill="#1B1A17" opacity="0.85"/>

  <!-- 肉垂：从下喙根部垂下的双尖瓣 -->
  <polygon points="456,311 514,311 480,402" fill="url(#wattleFill)" stroke="#1B1A17" stroke-width="6" stroke-linejoin="round"/>

  <!-- 眼：同心圆 + 菱形瞳 -->
  <circle cx="394" cy="322" r="26" fill="#FAF6EF" stroke="#1B1A17" stroke-width="7"/>
  <circle cx="394" cy="322" r="15" fill="#D9A441" stroke="#1B1A17" stroke-width="4"/>
  <polygon points="394,310 408,322 394,334 380,322" fill="#1B1A17"/>

  <!-- 压眉：决定「霸气」的那一条 -->
  <polygon points="348,268 438,296 434,308 346,280" fill="#1B1A17"/>

  <!-- 底座 -->
  <rect x="284" y="541" width="226" height="9" fill="#B3271E"/>
</svg>
